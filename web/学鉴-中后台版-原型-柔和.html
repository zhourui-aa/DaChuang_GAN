<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学鉴 · 课程作业AI生成内容检测与学术诚信工具（中后台原型）</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<style>
/* ============================================================
   设计令牌 —— 对齐 vue-next-admin：src/theme/app.scss
   ============================================================ */
:root{
  --next-color-white:#ffffff;
  --next-bg-main-color:#f8f8f8;
  --next-bg-color:#f5f5ff;
  --next-border-color-light:#f1f2f3;
  --next-color-primary-lighter:#ecf5ff;
  --next-color-success-lighter:#f0f9eb;
  --next-color-warning-lighter:#fdf6ec;
  --next-color-danger-lighter:#fef0f0;
  --next-bg-topBar:#ffffff;
  --next-bg-topBarColor:#606266;
  --next-bg-menuBar:#2f343a;
  --next-bg-menuBarColor:#bfc5ce;
  --next-bg-menuBarActiveColor:rgba(255,255,255,.10);
  --next-bg-menuBarTitle:#ffffff;
  --next-bg-menuBarDivider:rgba(255,255,255,.08);
  /* 柔化：全局圆角提升（对齐 themeConfig.pageRadius 可配机制） */
  --el-border-radius-base:10px;
  --el-border-radius-small:8px;
  --r-card:16px;
  --r-block:12px;
  --sh-soft:0 2px 12px rgba(0,21,41,.05);
  --sh-lift:0 8px 26px rgba(0,21,41,.09);
}
[data-theme="dark"]{
  --next-bg-main-color:#1f1f1f;
  --next-color-white:#191919;
  --next-border-color-light:#333333;
  --next-bg-topBar:#191919;
  --next-bg-topBarColor:#dadada;
  --next-bg-menuBar:#191919;
  --next-bg-menuBarColor:#c0c4cc;
  --next-bg-menuBarActiveColor:#1d1e1f;
  --el-text-color-primary:#dadada;
  --el-text-color-secondary:#9b9da1;
  --el-border-color:#424242;
  --el-bg-color:#191919;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--next-bg-main-color);
  font-family:Helvetica Neue,Helvetica,PingFang SC,Hiragino Sans GB,Microsoft YaHei,SimSun,sans-serif;
  font-size:14px;font-weight:400;color:var(--el-text-color-primary);
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#d0d0d0;border-radius:3px}

/* ---------- 工具类（对齐 references/utility-classes.md） ---------- */
.layout-pd{padding:15px}
.layout-padding{padding:15px}
.layout-padding-auto{height:100%}
.flex{display:flex}
.flex-warp{display:flex;flex-wrap:wrap}
.flex-auto{flex:1}
.flex-margin{margin:auto}
.cursor-pointer{cursor:pointer}
.w100{width:100%}
.h100{height:100%}
.text-center{text-align:center}
.mt5{margin-top:5px}.mt10{margin-top:10px}.mt15{margin-top:15px}.mt20{margin-top:20px}
.mb5{margin-bottom:5px}.mb10{margin-bottom:10px}.mb15{margin-bottom:15px}.mb20{margin-bottom:20px}
.ml5{margin-left:5px}.ml10{margin-left:10px}.ml15{margin-left:15px}
.mr5{margin-right:5px}.mr10{margin-right:10px}
.font12{font-size:12px}.font13{font-size:13px}.font16{font-size:16px}.font20{font-size:20px}
.font30{font-size:30px}.font32{font-size:32px}
.color-primary{color:var(--el-color-primary)}
.color-success{color:var(--el-color-success)}
.color-warning{color:var(--el-color-warning)}
.color-danger{color:var(--el-color-danger)}
.color-info{color:var(--el-text-color-secondary)}

/* ============================================================
   布局骨架 —— 复刻 vue-next-admin layout
   ============================================================ */
.layout{display:flex;height:100vh;overflow:hidden}
.layout-aside{
  width:220px;flex:0 0 220px;background:var(--next-bg-menuBar);
  border:0;
  box-shadow:0 2px 16px rgba(0,21,41,.06);
  display:flex;flex-direction:column;transition:width .3s ease;z-index:10;
}
.layout-aside .logo{
  height:58px;display:flex;align-items:center;justify-content:center;gap:9px;
  border:0;flex:0 0 58px;
}
.layout-aside .logo .logo-mark{
  width:26px;height:26px;border-radius:5px;background:var(--el-color-primary);
  color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;
}
.layout-aside .logo .logo-name{font-size:16px;font-weight:700;color:var(--next-bg-menuBarTitle);letter-spacing:1px}
.layout-aside .menu{flex:1;overflow-y:auto;padding:12px 0}
.menu-group{margin-bottom:2px}
.menu-group-title{
  padding:12px 20px 6px;font-size:12px;color:var(--next-bg-menuBarColor);letter-spacing:1px;opacity:.55;
}
.menu-item{
  display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;cursor:pointer;
  color:var(--next-bg-menuBarColor);font-size:14px;transition:background .3s ease,color .3s ease;
  border:0;background:transparent;width:calc(100% - 20px);margin:2px 10px;border-radius:10px;text-align:left;
}
.menu-item:hover{background:var(--next-bg-menuBarActiveColor)}
.menu-item.is-active{background:var(--next-bg-menuBarActiveColor);color:var(--next-bg-menuBarTitle);font-weight:500}
.menu-item .el-icon{font-size:16px}
.menu-item .badge{margin-left:auto}
.layout-aside .aside-foot{
  padding:12px 20px;border-top:1px solid var(--next-bg-menuBarDivider);
  font-size:12px;color:var(--next-bg-menuBarColor);line-height:1.8;flex:0 0 auto;opacity:.8;
}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--el-color-success);margin-right:6px;vertical-align:middle}
.dot.off{background:var(--el-text-color-secondary)}

.layout-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.layout-header{
  height:56px;flex:0 0 56px;background:var(--next-bg-topBar);
  border:0;box-shadow:0 1px 8px rgba(0,21,41,.045);
  display:flex;align-items:center;padding:0 18px;gap:12px;z-index:9;
}
.layout-header .crumb{font-size:13px;color:var(--el-text-color-secondary)}
.layout-header .crumb b{color:var(--el-text-color-primary);font-weight:500}
.layout-header .head-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.layout-header .head-right .el-icon{font-size:16px;color:var(--next-bg-topBarColor);cursor:pointer}
.layout-header .user{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--el-text-color-regular)}
.layout-content{flex:1;overflow-y:auto;background:var(--next-bg-main-color)}

/* ---------- 首页统计卡（复刻 home-card-item） ---------- */
.home-card-item{
  background:var(--next-color-white);border:0;
  border-radius:var(--r-card);padding:22px;height:100%;box-shadow:var(--sh-soft);
  transition:box-shadow .3s ease,transform .3s ease;
}
.home-card-item:hover{box-shadow:var(--sh-lift);transform:translateY(-3px)}
.home-card-item-icon{
  width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.home-card-item-icon i{font-style:normal;font-size:24px}
.home-card-title{font-size:14px;color:var(--el-text-color-regular)}
.home-card-num{font-size:30px;font-weight:600;color:var(--el-text-color-primary);letter-spacing:-.5px}

/* ---------- 业务页面 ---------- */
.page-head{margin-bottom:15px}
.page-head h2{margin:0;font-size:18px;font-weight:600;color:var(--el-text-color-primary)}
.page-head p{margin:6px 0 0;font-size:13px;color:var(--el-text-color-secondary);max-width:66ch}
.tip{margin-left:10px;color:var(--el-text-color-secondary);font-size:13px}
.note-box{
  margin-top:15px;padding:14px 18px;border-radius:var(--r-block);
  background:var(--next-color-primary-lighter);border:0;
  font-size:13px;color:var(--el-text-color-regular);line-height:1.8;
}
.note-box b{color:var(--el-text-color-primary)}

/* 报告：正文与证据 */
.doc{font-size:15px;line-height:2;color:var(--el-text-color-primary)}
.doc p{margin:0 0 16px;padding-left:14px;border-left:2px solid var(--next-border-color-light)}
.doc p.flag{border-left-color:var(--el-color-danger)}
.doc p.warn{border-left-color:var(--el-color-warning)}
.hl{background:var(--el-color-danger-light-9);border-bottom:1px dashed var(--el-color-danger-light-3);padding:1px 2px;border-radius:2px;cursor:pointer}
.hl.warn{background:var(--el-color-warning-light-9);border-bottom-color:var(--el-color-warning-light-3)}
.hl.on{background:var(--el-color-danger);color:#fff}
.hl.warn.on{background:var(--el-color-warning);color:#fff}
.para-meta{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding-left:14px;font-size:12px;color:var(--el-text-color-secondary)}
.ev-card{border:1px solid var(--el-color-danger-light-7);background:var(--el-color-danger-light-9);border-radius:4px;padding:14px}
.ev-card.warn{border-color:var(--el-color-warning-light-7);background:var(--el-color-warning-light-9)}
.ev-card .ev-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--el-color-danger);margin-bottom:8px}
.ev-card.warn .ev-h{color:var(--el-color-warning)}
.ev-card .ev-q{font-size:13px;line-height:1.8;padding-left:10px;border-left:2px solid currentColor;margin-bottom:10px;color:var(--el-text-color-primary)}
.ev-card .ev-k{font-size:12px;color:var(--el-text-color-secondary);margin-bottom:3px}
.ev-card .ev-t{font-size:13px;line-height:1.75;color:var(--el-text-color-regular)}

/* 登录页 */
.login-page{
  min-height:100vh;display:grid;place-items:center;background:var(--next-bg-main-color);padding:24px;
}
.login-box{width:420px}
.login-head{text-align:center;margin-bottom:22px}
.login-head .logo-mark{
  width:56px;height:56px;border-radius:18px;background:var(--el-color-primary);color:#fff;
  display:inline-grid;place-items:center;font-size:28px;font-weight:700;margin-bottom:12px;
  box-shadow:0 8px 20px rgba(64,158,255,.35);
}
.login-head h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--el-text-color-primary)}
.login-head p{margin:8px 0 0;font-size:13px;color:var(--el-text-color-secondary)}

/* ---------- 柔化：去硬边框，改用柔和投影（不新增游离色值） ---------- */
.layout .el-card,
.login-box .el-card{
  border:0;border-radius:var(--r-card);box-shadow:var(--sh-soft);
  transition:box-shadow .3s ease,transform .3s ease;
}
.layout .el-card.is-hover-shadow:hover{box-shadow:var(--sh-lift)}
.layout .el-card__header{border-bottom:1px solid var(--next-border-color-light);padding:16px 20px}
.layout .el-card__body{padding:20px}
/* 表格：弱化分隔线，去掉生硬的表头底色 */
.layout .el-table{--el-table-border-color:var(--next-border-color-light);--el-table-header-bg-color:transparent}
.layout .el-table th.el-table__cell{background:transparent;font-weight:500;color:var(--el-text-color-secondary)}
.layout .el-table td.el-table__cell{border-bottom:1px solid var(--next-border-color-light)}
.layout .el-table::before{display:none}
/* 输入 / 按钮 / 标签 跟随圆角令牌 */
.layout .el-button{border-radius:9px}
.layout .el-input__wrapper,.layout .el-textarea__inner{border-radius:9px}
.layout .el-tag{border-radius:7px}
.layout .el-progress-bar__outer,.layout .el-progress-bar__inner{border-radius:20px}
/* 深色下投影减淡 */
[data-theme="dark"] .home-card-item,[data-theme="dark"] .layout .el-card,[data-theme="dark"] .layout-aside,[data-theme="dark"] .layout-header{box-shadow:0 2px 14px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="app"></div>

<!-- ============================ 应用模板 ============================ -->
<script type="text/x-template" id="app-template">
<div>
  <!-- ---------------- 登录页 ---------------- -->
  <div class="login-page" v-if="!state.login">
    <div class="login-box">
      <div class="login-head">
        <div class="logo-mark">鉴</div>
        <h1>学 鉴</h1>
        <p>课程作业 AI 生成内容检测与学术诚信工具 · 学生端</p>
      </div>
      <el-card shadow="hover">
        <el-form :model="state.loginForm" label-position="top" @submit.prevent>
          <el-form-item label="学号">
            <el-input v-model="state.loginForm.sid" placeholder="请输入学号" clearable />
          </el-form-item>
          <el-form-item label="密码">
            <el-input v-model="state.loginForm.pwd" type="password" placeholder="请输入密码" show-password />
          </el-form-item>
          <el-button type="primary" class="w100" style="height:38px" @click="onLogin">登 录</el-button>
        </el-form>
        <div class="text-center mt15">
          <el-link type="primary" :underline="false" @click="onEnterTeacher">教师端演示入口 →</el-link>
        </div>
      </el-card>
      <p class="text-center color-info font12 mt15">演示环境 · 任意账号密码均可登录 · 示例数据</p>
    </div>
  </div>

  <!-- ---------------- 后台布局 ---------------- -->
  <div class="layout" v-else>
    <!-- 侧栏 -->
    <aside class="layout-aside">
      <div class="logo">
        <div class="logo-mark">鉴</div>
        <div class="logo-name">学鉴</div>
      </div>
      <div class="menu">
        <div class="menu-group" v-for="(g, gi) in menus" :key="gi">
          <div class="menu-group-title">{{ g.title }}</div>
          <button class="menu-item" :class="{'is-active': state.page === m.key}"
                  v-for="m in g.items" :key="m.key" @click="go(m.key)">
            <el-icon><component :is="m.icon" /></el-icon>
            <span>{{ m.name }}</span>
            <el-badge v-if="m.badge" :value="m.badge" class="badge" />
          </button>
        </div>
      </div>
      <div class="aside-foot">
        <span class="dot" :class="{off: state.engine.busy}"></span>{{ state.engine.busy ? '本地检测引擎 · 分析中' : '本地检测引擎 · 已就绪' }}<br>
        <span style="opacity:.75">数据不出校园 · {{ state.role === 'teacher' ? '教师端' : '学生端' }}</span>
      </div>
    </aside>

    <!-- 主区 -->
    <div class="layout-main">
      <header class="layout-header">
        <el-icon @click="state.collapse = !state.collapse"><Fold /></el-icon>
        <div class="crumb">{{ state.role === 'teacher' ? '教师端' : '学生端' }} / <b>{{ pageName }}</b></div>
        <div class="head-right">
          <el-switch v-model="state.isDark" inline-prompt active-text="深" inactive-text="浅"
                     @change="onToggleDark" style="margin-right:6px" />
          <el-icon title="切换端" @click="switchRole"><Switch /></el-icon>
          <el-badge :value="state.role==='teacher'?2:1" class="mr10"><el-icon><Bell /></el-icon></el-badge>
          <div class="user">
            <el-avatar :size="28" style="background:var(--el-color-primary)">{{ state.role==='teacher'?'李':'张' }}</el-avatar>
            {{ state.role === 'teacher' ? '李建国 · 智能制造学院' : '张文博 · 智能制造 2301 班' }}
          </div>
        </div>
      </header>

      <main class="layout-content">
        <!-- ============ 教师 · 概览 ============ -->
        <div class="layout-pd" v-show="state.page === 't-overview'">
          <div class="page-head">
            <h2>作业诚信概览</h2>
            <p>本学期《智能制造技术导论》《机械制图》两门课程作业检测汇总。所有检测均在本校本地模型完成，作业原文不出校园。</p>
          </div>
          <el-row :gutter="15" class="mb15">
            <el-col :xs="24" :sm="12" :md="12" :lg="6" :xl="6" class="mb15" v-for="(v,k) in overviewCards" :key="k">
              <div class="home-card-item flex">
                <div class="flex-margin flex w100">
                  <div class="flex-auto">
                    <div class="home-card-title">{{ v.title }}</div>
                    <div class="mt10">
                      <span class="home-card-num">{{ v.num }}</span>
                      <span class="ml5 font16" :style="{color:v.tone}">{{ v.sub }}</span>
                    </div>
                    <div class="mt10 font13 color-info">{{ v.desc }}</div>
                  </div>
                  <div class="home-card-item-icon" :style="{background:v.bg}">
                    <el-icon :style="{color:v.tone}"><component :is="v.icon" /></el-icon>
                  </div>
                </div>
              </div>
            </el-col>
          </el-row>
          <el-row :gutter="15" class="mb15">
            <el-col :xs="24" :sm="14" :md="14" :lg="16" :xl="16">
              <el-card shadow="hover"><div ref="lineRef" style="height:320px"></div></el-card>
            </el-col>
            <el-col :xs="24" :sm="10" :md="10" :lg="8" :xl="8">
              <el-card shadow="hover"><div ref="pieRef" style="height:320px"></div></el-card>
            </el-col>
          </el-row>
          <el-card shadow="hover">
            <template #header><span style="font-weight:600">近期检测记录</span></template>
            <el-table :data="recent" style="width:100%">
              <el-table-column type="index" label="序号" width="60" />
              <el-table-column prop="t" label="作业" show-overflow-tooltip min-width="240" />
              <el-table-column prop="s" label="提交人" width="150" show-overflow-tooltip />
              <el-table-column label="AI 疑似度" width="200">
                <template #default="scope">
                  <el-progress :percentage="Math.round(scope.row.v*100)"
                    :color="band(scope.row.v).color" :stroke-width="8" />
                </template>
              </el-table-column>
              <el-table-column label="判定" width="90">
                <template #default="scope"><el-tag :type="band(scope.row.v).tag">{{ band(scope.row.v).label }}</el-tag></template>
              </el-table-column>
              <el-table-column prop="at" label="检测时间" width="140" />
            </el-table>
          </el-card>
          <div class="note-box"><b>关于判定口径：</b>本工具不直接给出"是否作弊"的结论，只输出疑似度与可追溯的特征证据，供教师人工判断。当前数据为演示示例。</div>
        </div>

        <!-- ============ 学生 · 我的作业 ============ -->
        <div class="layout-pd" v-show="state.page === 's-home'">
          <div class="page-head">
            <h2>我的作业</h2>
            <p>本学期作业提交与检测情况。所有分析均在本校本地模型完成，你的作业原文不会离开校园。</p>
          </div>
          <el-row :gutter="15" class="mb15">
            <el-col :xs="12" :sm="6" :md="6" :lg="6" :xl="6" v-for="(v,k) in studentStats" :key="k">
              <el-card shadow="hover"><el-statistic :title="v.title" :value="v.num"><template #suffix><span class="font13 color-info">{{ v.unit }}</span></template></el-statistic></el-card>
            </el-col>
          </el-row>
          <el-card shadow="hover">
            <template #header><span style="font-weight:600">作业列表</span><span class="tip">2026-2027 学年第一学期</span></template>
            <el-table :data="myWork" style="width:100%">
              <el-table-column type="index" label="序号" width="60" />
              <el-table-column prop="t" label="作业名称" min-width="240" show-overflow-tooltip />
              <el-table-column prop="c" label="课程" width="160" />
              <el-table-column label="AI 疑似度" width="180">
                <template #default="scope">
                  <span v-if="scope.row.v===null"><el-icon class="is-loading"><Loading /></el-icon> <span class="color-info font13">检测中…</span></span>
                  <el-progress v-else :percentage="Math.round(scope.row.v*100)" :color="band(scope.row.v).color" :stroke-width="8" />
                </template>
              </el-table-column>
              <el-table-column label="状态" width="100">
                <template #default="scope">
                  <el-tag v-if="scope.row.v===null" type="info">分析中</el-tag>
                  <el-tag v-else :type="band(scope.row.v).tag">{{ band(scope.row.v).label }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="操作" width="120" fixed="right">
                <template #default="scope">
                  <el-button size="small" text type="primary" :disabled="scope.row.v===null" @click="go('s-report')">查看报告</el-button>
                </template>
              </el-table-column>
            </el-table>
          </el-card>
          <div class="note-box"><b>关于检测结果：</b>本工具只输出疑似度与可追溯的特征证据，<b>不直接认定作弊</b>。若对结果有异议，可在收到结果后 5 个工作日内发起申诉复核。</div>
        </div>

        <!-- ============ 提交作业（学生/教师共用） ============ -->
        <div class="layout-pd" v-show="state.page==='s-upload' || state.page==='t-upload'">
          <div class="page-head">
            <h2>作业检测</h2>
            <p>上传后自动完成「困惑度 / 改写痕迹 / 行文轨迹」三维特征分析，生成带证据的可解释报告。本地模型处理，文本不外传。</p>
          </div>
          <el-card shadow="hover" class="mb15">
