server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: assignment-integrity
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/integrity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ""
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  sql:
    init:
      # P0 首次启动自动建表 + 灌种子数据；改为 never 可关闭
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      # 失败必须报错，避免像 courses 种子那样被静默吞掉
      continue-on-error: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.integrity.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 接口文档 http://localhost:8080/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 应用自定义配置
integrity:
  jwt:
    secret: "integrity-p0-secret-key-please-change-in-prod-0123456789"
    expire-minutes: 480
  detect:
    # P0：stats = 纯统计特征引擎（无 LLM）；llm = 走 MCP 调 Python（P1）
    engine: stats
    # 短文本门槛，低于此字符数不计综合分
    min-chars: 200
    # 单条检测超时（毫秒）
    timeout-ms: 30000
  storage:
    # P0：本地文件目录替代 MinIO
    local-dir: ./data/files

logging:
  level:
    com.integrity: debug
